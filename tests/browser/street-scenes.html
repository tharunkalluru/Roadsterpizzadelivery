<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delivery scene checks</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171321;color:#f5ecd9;font:15px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}
aside{position:fixed;top:12px;left:12px;width:260px;max-height:calc(100vh - 24px);overflow:auto;background:#211b32;padding:16px;border:1px solid #8d7da6;border-radius:12px}
h1{font-size:18px;margin:0 0 12px}label{display:block;font-size:13px}select,button{color:inherit;background:#42354f;border:1px solid #aa9abb;border-radius:8px;padding:9px;margin:5px 0;width:100%;font:inherit}button{cursor:pointer}button:active{transform:translateY(1px);background:#6b5678}
output{display:block;white-space:pre-wrap;font-size:13px;line-height:1.5;margin-top:10px}p{font-size:12px;line-height:1.5;color:#c9c0d2}.row{display:flex;gap:6px}
@media(max-height:450px){aside{width:215px;padding:10px}h1{font-size:15px}button,select{padding:5px}p{margin:5px 0}}
</style></head><body><canvas id="world"></canvas><aside><h1>Delivery scene checks</h1>
<label>Scene<select id="scene"><option value="ropeBucket">Paradise rope bucket</option><option value="haunted">Haunted mansion gate</option><option value="college">Degree college gate</option><option value="villa">Villa 79 entrance</option><option value="salaar">Fortified courtyard</option><option value="walkingHandoff">Walking handover</option><option value="weddingHandoff">Village procession</option><option value="angleParking">45° parking</option><option value="classroomHandoff">Medical college classroom</option></select></label>
<div class="row"><button id="approach">Approach</button><button id="deliver">Deliver</button></div>
<div class="row"><button id="front">Front</button><button id="above">Above</button><button id="reset">Reset</button></div>
<p>Scene fixture, not a game performance benchmark. The small white vehicle is a test marker. Drag to orbit, scroll to zoom. W/S moves, A/D steers, Space brakes, E delivers. Unapproved named actors stay absent.</p>
<output id="status"></output><output id="stats"></output></aside><script type="module" src="./street-scenes.browser.ts"></script></body></html>
