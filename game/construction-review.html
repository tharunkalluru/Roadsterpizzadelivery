<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hyderabad construction geometry review</title><link rel="stylesheet" href="./fonts/fonts.css"><style>
html,body,#view{width:100%;height:100%;margin:0;overflow:hidden;background:#17132b;color:#fff8e6;font:14px system-ui}canvas{display:block}aside{position:fixed;z-index:3;top:10px;left:10px;max-width:420px;border:1px solid #a98acb;border-radius:12px;padding:12px;background:#21182eea}button,select{min-height:40px;margin:4px;font:700 13px system-ui;color:inherit;border:1px solid #a98acb;border-radius:9px;padding:7px;background:#372743}h1{font-size:17px;margin:0 0 7px}output{white-space:pre-wrap;display:block;font:12px/1.4 monospace}.notice{position:fixed;bottom:8px;left:8px;padding:5px;background:#21182edb;color:#ffcf60;border-radius:7px}aside[hidden]{display:none}#toggle{position:fixed;right:10px;top:10px;z-index:4}#loading{position:fixed;inset:0;background:#17132b;display:grid;place-items:center;z-index:5}#loading[hidden]{display:none}</style></head><body><div id="view"></div><aside><h1>Construction · actual streamed geometry</h1><p>Controlled camera views, not driving or delivery completion.</p><label>Site <select id="site"><option value="uppal">Uppal–Narapally · open lane</option><option value="iiit">IIIT Junction · excavation</option></select></label><div><button id="road">Road approach</button><button id="opposite">Opposite approach</button><button id="overview">Overview</button><button id="night">Day / night</button></div><output id="status">Loading source streets…</output></aside><button id="toggle">Hide review panel</button><div class="notice">Dated construction component review · lane / machinery layout estimated</div><div id="loading">Loading actual city tiles…</div>
<script type="module">
import * as THREE from 'three';import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';import {initTemplates} from './src/core/util';import {Engine} from './src/core/engine';import {moodAt} from './src/core/sky';import {fetchPack} from './src/world/packs';import {World} from './src/world/world';import {prepareRoadGrades} from './src/world/road-grades';import {RoadGraph} from './src/game/roadgraph';import {constructionLane} from './src/world/construction';import {Player} from './src/game/player';
try{initTemplates({rbox:new RoundedBoxGeometry(1,1,1,3,.12),ring:new THREE.RingGeometry(1,1.35,40)});const core=await fetchPack('./city/core.pack.wasm');core.roads=prepareRoadGrades(core.roads);const engine=new Engine(document.querySelector('#view'),{lowQ:true});const world=new World(core,engine.mats,{lowQ:true,base:new URL('./city/',location.href).href});engine.scene.add(world.group);world.signs.init(.6);const graph=new RoadGraph(core.roads),player=new Player(world,engine.mats);player.addTo(engine.scene);let selected=new URLSearchParams(location.search).get('site')==='iiit'?'iiit':'uppal',view='road',night=false,pose=null;
async function select(){document.querySelector('#loading').hidden=false;const site=world.construction.sites.find(s=>s.id===(selected==='uppal'?'uppal-narapally':'iiit-junction'));if(!site)throw new Error('No source-bound construction site');const choices=graph.edges.filter(g=>selected==='uppal'?g.e.workZone:g.e.cls==='primary'||g.e.cls==='secondary'),near=choices.map(g=>({g,d:Math.min(...g.e.pts.map(p=>Math.hypot(p[0]-site.x,p[1]-site.z)))})).sort((a,b)=>a.d-b.d)[0];if(!near)throw new Error('No source road at site');const g=near.g,dir=g.e.oneway==='forward'?-1:1;pose=graph.pointAt(g,g.len/2,dir,constructionLane(g.e,dir)??Math.min(2.5,g.e.w*.2));await world.ensure(pose.x,pose.z,500);world.focus=[pose.x,pose.z];document.querySelector('#status').textContent=`${site.name}\n${g.e.name||g.e.cls} [${g.e.id}]\n${world.construction.roads.length} source road fragments · ${world.construction.piers.length} unfinished piers\n${g.e.workZone?'One open 4.5m lane in each carriageway · 25km/h work zone':'Junction shoulder excavation, changing DLF gate diversion not reconstructed'}\nSnapshot26 Oct2026; barricade positions estimated.`;document.querySelector('#loading').hidden=true;show();}
function show(){if(!pose)return;const p=pose,d=view==='opposite'?-1:1;player.pos.set(p.x,.55,p.z);player.yaw=Math.atan2(-p.hx,-p.hz);player.syncPose?.();player.group.position.set(p.x,.55,p.z);player.group.rotation.y=player.yaw;const high=view==='overview';engine.camera.position.set(p.x-p.hx*(high?90:26)*d+(high?p.hz*65:0),high?45:6,p.z-p.hz*(high?90:26)*d-(high?p.hx*65:0));engine.camera.lookAt(p.x+p.hx*45*d,high?3:4,p.z+p.hz*45*d);engine.applyMood(moodAt(night?21:15),{signs:v=>world.signs.setEmissive(v)});engine.placeSun(new THREE.Vector3(p.x,0,p.z));world.signs.update(engine.camera.position.x,engine.camera.position.z,true);engine.render();}
document.querySelector('#site').value=selected;document.querySelector('#site').onchange=async e=>{selected=e.target.value;const url=new URL(location.href);url.searchParams.set('site',selected);history.replaceState(null,'',url);await select()};for(const id of ['road','opposite','overview'])document.getElementById(id).onclick=()=>{view=id;show()};document.querySelector('#night').onclick=()=>{night=!night;show()};document.querySelector('#toggle').onclick=e=>{const p=document.querySelector('aside');p.hidden=!p.hidden;e.target.textContent=p.hidden?'Show review panel':'Hide review panel'};await select();window.addEventListener('resize',show);
}catch(error){document.querySelector('#loading').textContent=String(error);console.error(error)}
</script></body></html>
