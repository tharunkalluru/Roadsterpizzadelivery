<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destination source/model review</title>
<style>html,body{margin:0;height:100%;background:#17132b;color:#fff5df;font:14px system-ui}header{padding:12px;background:#281d37}h1{font-size:18px;margin:0 0 6px}select{min-height:42px;background:#49324f;color:#fff5df;border:1px solid #bea5d2;border-radius:8px;padding:4px 8px;max-width:95vw}p{margin:6px 0;max-width:1100px}#view{height:calc(100% - 190px);min-height:300px}canvas{width:100%;height:100%;display:block}output{display:block;font:12px ui-monospace;white-space:pre-wrap}a{color:#6bead7}</style>
<header><h1>Destination geometry · source-bound component review</h1><p>Actual production models and shipped source IDs. Isolated inspection; no driving, delivery or survey claim. Mapped outlines are retained; facade/height/entrance details remain stylized.</p><select aria-label="Destination source"></select><output id="status">Loading source inventory…</output></header><div id="view"></div>
<script type="module">
import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
import{initTemplates,TiledBatch}from'/src/core/util.ts';import{placeLandmarks,drawLandmark}from'/src/world/landmarks.ts';
import{DESTINATION_HERO_PLANS}from'/src/world/destination-hero-data.ts';import{DESTINATION_IDENTITIES}from'/src/world/destination-data.ts';
import{buildTile}from'/src/world/city.ts';import{fetchPack}from'/src/world/packs.ts';import{prepareRoadGrades,roadGradePatches,applyRoadGradePatches}from'/src/world/road-grades.ts';
if(!import.meta.env.DEV)throw Error('Development component view only');initTemplates();
const core=await fetchPack('/city/core.pack.wasm'),landmarks=placeLandmarks(core.origin),patches=roadGradePatches(prepareRoadGrades(core.roads)),select=document.querySelector('select'),status=document.querySelector('#status'),view=document.querySelector('#view');
const choices=Object.keys(DESTINATION_HERO_PLANS).map(id=>({id,name:landmarks.find(l=>l.id===id).name,hero:true}));
for(const kind of['university','college','office']){const candidates=DESTINATION_IDENTITIES.filter(r=>r.kind===kind).sort((a,b)=>b.confidence-a.confidence||a.name.localeCompare(b.name));const r=candidates.find(r=>/Vasavi|Osmania|VNR|JNTU|Microsoft|IIIT|Infosys/.test(r.name))||candidates[0];if(r)choices.push({...r,hero:false});}
for(const c of choices){const option=document.createElement('option');option.value=c.id;option.textContent=c.name;select.append(option);}
const scene=new THREE.Scene();scene.background=new THREE.Color('#c9d6dc');scene.add(new THREE.AmbientLight('#fff7e7',2));const sun=new THREE.DirectionalLight('#ffffff',2.4);sun.position.set(-150,240,-160);scene.add(sun);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(48,1,.1,6000),orbit=new OrbitControls(camera,renderer.domElement);let group=new THREE.Group();scene.add(group);
const material=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.75,side:THREE.DoubleSide});let request=0;
function fit(){renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();renderer.render(scene,camera);}addEventListener('resize',fit);orbit.addEventListener('change',()=>renderer.render(scene,camera));
async function show(){const current=++request,c=choices.find(c=>c.id===select.value);status.textContent='Building production source geometry…';let built,B,center,span=160;
if(c.hero){const l=landmarks.find(l=>l.id===c.id),plan=DESTINATION_HERO_PLANS[c.id];B=Object.fromEntries(['st','wall','park','water','roof','lit','glow','road','marks','foot','kerb','shop'].map(k=>[k,new TiledBatch()]));drawLandmark({...l,x:0,z:0},{B,obstacle(){},solid(){},road:()=>false,roadY:()=>null,sign(){}});center=[0,0];span=Math.max(...plan.ring.map(p=>Math.hypot(...p)))*1.7;status.textContent=`Source ${plan.sourceId} v${plan.version} · ${plan.timestamp}\n${plan.official}\nGeographic source vertices retained; no inferred nearest-building placement.`;
}else{const[i,j]=c.tile,pack=core.packs.find(p=>p.tiles.some(t=>t[0]===i&&t[1]===j)),data=await fetchPack('/city/'+pack.file),z=data.tiles[c.tile.join('_')];built=buildTile({...z,roads:applyRoadGradePatches(z.roads,patches)},{lowQ:true,metro:core.metro,destinations:DESTINATION_IDENTITIES.filter(r=>r.tile[0]===i&&r.tile[1]===j)});center=[(c.a[0]+c.b[0])/2,(c.a[1]+c.b[1])/2];span=110;status.textContent=`Exact shipped building ${c.buildingId} · board ${c.boardId}\n${c.name} · ${c.kind} · source confidence ${c.confidence}\nSource association/facade remains inferred; this view is not a photo match.`;}
if(current!==request)return;scene.remove(group);group.traverse(o=>{if(o.isMesh)o.geometry.dispose();});group=new THREE.Group();scene.add(group);
if(B){for(const batch of Object.values(B))for(const mesh of batch.meshes(material))group.add(mesh);}else for(const buffer of built.buffers){const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(buffer.pos,3));geometry.setAttribute('normal',new THREE.BufferAttribute(buffer.nor,3));geometry.setAttribute('color',new THREE.BufferAttribute(buffer.col,3));group.add(new THREE.Mesh(geometry,material));}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(span*8,span*8),new THREE.MeshStandardMaterial({color:'#92977f',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(center[0],-.06,center[1]);group.add(ground);camera.position.set(center[0]+span*.8,span*.65,center[1]+span);orbit.target.set(center[0],10,center[1]);orbit.update();fit();}
select.addEventListener('change',()=>show().catch(e=>{status.textContent=String(e);console.error(e)}));await show();
</script></html>
