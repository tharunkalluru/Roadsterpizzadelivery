<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Railway source geometry review</title><link rel="stylesheet" href="./fonts/fonts.css"><style>
html,body,#view{margin:0;width:100%;height:100%;overflow:hidden;background:#18142b;color:#fff8e6;font:14px system-ui}canvas{display:block}aside{position:fixed;z-index:3;top:10px;left:10px;max-width:390px;padding:12px;border-radius:12px;background:#21182ef2;border:1px solid #a98acb}h1{margin:0 0 8px;font-size:17px}p{font-size:12px}select,button{min-height:40px;margin:3px;padding:6px;background:#372743;color:inherit;border:1px solid #a98acb;border-radius:9px}output{display:block;white-space:pre-wrap;font:12px monospace}#loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#18142b}#loading[hidden],aside[hidden]{display:none}#toggle{position:fixed;right:12px;top:12px;z-index:4}
</style></head><body><div id="view"></div><aside><h1>Railway · retained map geometry</h1><p>Static camera review of the production streamed World and train movement. This is a component scene, not driving or delivery verification. Track heights and station fittings are model approximations.</p><select id="station" aria-label="Railway station"></select><div><button data-view="platform">Along tracks</button><button data-view="overview">Overview</button></div><output id="status">Loading…</output></aside><button id="toggle">Hide review panel</button><div id="loading">Loading retained railway geometry…</div>
<script type="module">
import * as THREE from 'three';import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';import {initTemplates} from './src/core/util';import {Engine} from './src/core/engine';import {moodAt} from './src/core/sky';import {fetchPack} from './src/world/packs';import {World} from './src/world/world';import {prepareRoadGrades} from './src/world/road-grades';import {railwayNetwork} from './src/world/railway-geometry';import {RailTrains} from './src/game/rail';
if(!import.meta.env.DEV)throw new Error('Development component review only');
try{
initTemplates({rbox:new RoundedBoxGeometry(1,1,1,3,.12),ring:new THREE.RingGeometry(1,1.35,40)});
const core=await fetchPack('./city/core.pack.wasm');core.roads=prepareRoadGrades(core.roads);
const engine=new Engine(document.querySelector('#view'),{lowQ:false}),world=new World(core,engine.mats,{lowQ:false,base:new URL('./city/',location.href).href}),network=railwayNetwork();
engine.scene.add(world.group);world.signs.init(.6);const trains=new RailTrains(engine.mats.vBody);engine.scene.add(trains.group);
const select=document.querySelector('#station');for(const s of network.stations){const o=document.createElement('option');o.value=s.id;o.textContent=s.t['name:en']||s.t.name;select.appendChild(o);}
select.value=new URLSearchParams(location.search).get('station')||'n10252989488';let at,view='platform',ready=false;
function camera(){if(!at)return;const high=view==='overview';engine.camera.position.set(at.x-at.hx*(high?90:65)+at.hz*(high?75:13),at.y+(high?65:7),at.z-at.hz*(high?90:65)-at.hx*(high?75:13));engine.camera.lookAt(at.x+at.hx*20,at.y+2.8,at.z+at.hz*20);engine.applyMood(moodAt(14),{signs:v=>world.signs.setEmissive(v)});engine.placeSun(new THREE.Vector3(at.x,at.y,at.z));world.signs.update(at.x,at.z,true);}
async function load(){ready=false;document.querySelector('#loading').hidden=false;const station=network.stations.find(s=>s.id===select.value)||network.stations[0],p=network.center(station);at=network.closest(...p,150);await world.ensure(at.x,at.z,500);world.focus=[at.x,at.z];const signs=[...world.tiles.values()].flatMap(t=>t.built.signs).filter(s=>s.id.startsWith('x'+station.id+':'));document.querySelector('#status').textContent=`${station.t['name:en']||station.t.name}\nOSM ${station.id} · track ${at.profile.id}\n${signs.length} name text faces · ${world.rails.size} loaded main track ways\nShared track/mesh/train height ${at.y.toFixed(2)} m (model)`;document.querySelector('#loading').hidden=true;ready=true;camera();}
select.onchange=load;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;camera()});document.querySelector('#toggle').onclick=e=>{const panel=document.querySelector('aside');panel.hidden=!panel.hidden;e.target.textContent=panel.hidden?'Show review panel':'Hide review panel'};addEventListener('resize',camera);let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(ready){trains.update(dt,at.x,at.z,world.rails);engine.render();}requestAnimationFrame(frame)}requestAnimationFrame(frame);await load();
}catch(error){document.querySelector('#loading').textContent=String(error);console.error(error)}
</script></body></html>
