<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone feedback acceptance review</title>
<style>
body{margin:0;background:#171125;color:#fff9ea;font:14px system-ui,sans-serif}header{display:flex;align-items:center;gap:8px;padding:10px;flex-wrap:wrap}button,select{min-height:36px;padding:0 10px;border:1px solid #b98ceb;border-radius:10px;background:#30213f;color:#fff9ea;cursor:pointer}button[aria-pressed=true]{border-color:#ffbf00}p{margin:0}#stage{margin:0 10px;position:relative}iframe{display:block;border:0;transform-origin:top left;outline:1px solid #b98ceb}small{display:block;padding:0 10px 10px;color:#d3c8e8}
</style>
<header><p>Phone acceptance QA</p><select aria-label="Test surface"><option value="./mobile-control-review.html">Production HUD component</option><option value="./mobile-ui-playtest.html">Production game touch UI</option></select><button data-size="800,360">Compact landscape</button><button data-size="900,400">Wide landscape</button><button data-size="844,390">Phone landscape</button><button data-size="640,360">Small landscape</button><button data-size="390,844">Phone portrait</button><button data-size="320,568">Small portrait</button><button id="qa-show" type="button">Show component controls</button><output id="size"></output></header>
<small>The frame uses the displayed CSS dimensions. Scaling only fits the review page; it does not change the game viewport. Component scenarios are not gameplay completions.</small>
<div id="stage"><iframe allow="fullscreen" allowfullscreen title="Phone acceptance surface" src="./mobile-control-review.html" width="800" height="360"></iframe></div>
<script>
const frame=document.querySelector('iframe'),stage=document.querySelector('#stage');let w=800,h=360;
function fit(){const scale=Math.min(1,(innerWidth-24)/w,Math.max(240,innerHeight-130)/h);frame.width=w;frame.height=h;frame.style.transform=`scale(${scale})`;stage.style.width=`${w*scale}px`;stage.style.height=`${h*scale}px`;document.querySelector('#size').textContent=`${w} × ${h} CSS pixels`;document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.size===`${w},${h}`)));}
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{[w,h]=b.dataset.size.split(',').map(Number);fit();}));document.querySelector('select').addEventListener('change',e=>{frame.src=e.target.value;});document.querySelector('#qa-show').addEventListener('click',()=>frame.contentWindow.postMessage('qa-show-controls',location.origin));addEventListener('resize',fit);fit();
</script></html>
