<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bus route readiness review</title>
<style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden;font:14px/1.4 system-ui}#panel{position:fixed;z-index:2;left:12px;top:12px;width:min(550px,calc(100vw - 48px));padding:12px;border-radius:12px;background:#fff6e9f5;color:#17132b}h1{font-size:18px;margin:0}p{margin:6px 0}button{font:inherit;padding:8px;margin:6px 8px 6px 0}output{display:block;white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace}#verdict{font-weight:800}</style>
<div id="view"></div><main id="panel"><h1>Bus route 1 · repaired source-leg review</h1><p>Actual source roads, assigned route, tiles and production bus model/movement. Prescribed start, no other vehicles. This real-time component review does not count as normal-world gameplay.</p><label><input id="collision" type="checkbox" checked> Source-tile collision and signals</label><br><button id="toggle">Start</button><button id="reset">Restart at source start</button><output id="verdict">Loading…</output><output id="readout"></output></main>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {Engine} from '/src/core/engine.ts';
import {moodAt} from '/src/core/sky.ts';
import {initTemplates} from '/src/core/util.ts';
import {RoadGraph} from '/src/game/roadgraph.ts';
import {Traffic} from '/src/game/traffic.ts';
import {busLane} from '/src/game/bus-path.ts';
import {busRouteBoards} from '/src/world/traffic_models.ts';
import {buildTile} from '/src/world/city.ts';
import {placeLandmarks} from '/src/world/landmarks.ts';
if(!import.meta.env.DEV)throw new Error('Development review only');
try{
initTemplates({rbox:new RoundedBoxGeometry(1,1,1,3,.12),ring:new THREE.RingGeometry(1,1.35,40)});const fixture=await(await fetch('/bus-readiness-fixture.json')).json(),graph=new RoadGraph(fixture.roads);
const engine=new Engine(document.querySelector('#view'),{lowQ:true});engine.applyMood(moodAt(15));
const city={surfaceGrid:new Map(),buildingGrid:new Map(),landmarkSurfaceGrid:new Map(),walls:new Map(),obstacles:new Map(),movingRail:[]},signals=[];
const landmarks=placeLandmarks(fixture.origin,fixture.indexedTiles);
for(const tile of fixture.tiles){const built=buildTile(tile,{lowQ:true,landmarks,metro:fixture.metro});signals.push(...built.signals);
 for(const key of ['surfaceGrid','buildingGrid','landmarkSurfaceGrid','walls','obstacles'])for(const[cell,items]of built[key]||[])city[key].set(cell,[...(city[key].get(cell)||[]),...items]);
 for(const buf of built.buffers){const geo=new THREE.BufferGeometry();for(const[name,data,size]of [['position',buf.pos,3],['normal',buf.nor,3],['uv',buf.uv,2],['color',buf.col,3]])geo.setAttribute(name,new THREE.BufferAttribute(data,size));const mesh=new THREE.Mesh(geo,engine.mats[buf.mat]);mesh.castShadow=true;mesh.receiveShadow=true;engine.scene.add(mesh);}}
const traffic=new Traffic(graph,engine.scene,engine.mats,0,[],city);traffic.setBusFeed(fixture.feed);graph.markSignals(signals);
const alignment=fixture.feed.alignments[fixture.alignmentId],pattern=fixture.feed.patterns[0],first=alignment.steps[0];
const start=graph.byId.get(first.edge),startS=first.from;
const roadMat=new THREE.MeshStandardMaterial({color:'#43474c',roughness:.9,side:THREE.DoubleSide});
if(!fixture.tiles.length)for(const edge of graph.edges){const vertices=[];for(let i=1;i<edge.e.pts.length;i++){const a=edge.e.pts[i-1],b=edge.e.pts[i],dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz)||1,nx=-dz/len*edge.e.w/2,nz=dx/len*edge.e.w/2,ya=(edge.e.elev?.[i-1]||0)+.005,yb=(edge.e.elev?.[i]||0)+.005;
 vertices.push(a[0]+nx,ya,a[1]+nz,a[0]-nx,ya,a[1]-nz,b[0]+nx,yb,b[1]+nz,b[0]+nx,yb,b[1]+nz,a[0]-nx,ya,a[1]-nz,b[0]-nx,yb,b[1]-nz);}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geo.computeVertexNormals();engine.scene.add(new THREE.Mesh(geo,roadMat));}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshStandardMaterial({color:'#b7b6a6',roughness:1})),startP=graph.pointAt(start,startS,first.dir);ground.rotation.x=-Math.PI/2;ground.position.set(startP.x,-.04,startP.z);engine.scene.add(ground);
let bus,run,running=false,elapsed=0,dwelled=false,last=performance.now();
const verdict=document.querySelector('#verdict'),readout=document.querySelector('#readout'),toggle=document.querySelector('#toggle');
function reset(){traffic.clear();traffic.setBusFeed(fixture.feed);bus=traffic.spawnAt('bus',start,first.dir,startS,busLane(start));run=traffic.services.bind(start,first.dir,startS,0);if(!run)throw new Error('Source leg did not bind');bus.busRun=run;bus.routeDecals=busRouteBoards(pattern.number,pattern.to);for(const decal of bus.routeDecals)bus.g.add(new THREE.Mesh(decal.geo,decal.mat));running=false;elapsed=0;dwelled=false;toggle.textContent='Start';}
toggle.onclick=()=>{running=!running;toggle.textContent=running?'Pause':'Resume';};document.querySelector('#reset').onclick=reset;addEventListener('blur',()=>{running=false;toggle.textContent='Resume';});reset();
document.querySelector('#collision').onchange=e=>{traffic.city=e.target.checked?city:undefined;graph.markSignals(e.target.checked?signals:[]);reset();};
function tick(now){const dt=Math.min(.035,Math.max(0,(now-last)/1000));last=now;if(running){elapsed+=dt;traffic.update(dt,bus.x,bus.z,{x:bus.x+290,z:bus.z+290,y:bus.y+.55,speed:0,hx:1,hz:0},[]);dwelled ||= bus.dwell>0;}
 const served=dwelled&&run.ended;verdict.textContent=served?'PASS · destination explicitly served':running?'RUNNING · destination not yet served':'PAUSED · destination not yet served';verdict.style.color=served?'#166135':'#305982';
 readout.textContent=`Route ${pattern.number}: ${fixture.feed.stops[pattern.stops[0]][0]} → ${fixture.feed.stops[pattern.stops[1]][0]}\nElapsed ${elapsed.toFixed(1)} s · speed ${(bus.speed*3.6).toFixed(1)} km/h\nEdge ${bus.edge.e.id} · step ${run.step+1}/${run.path.length}\nStop dwell ${bus.dwell.toFixed(1)} s · observed dwell ${dwelled}\nService ended ${run.ended}\nAlignment ${fixture.alignmentId}\nSource pack SHA256 ${fixture.sourceSha256}`;
 engine.camera.position.set(bus.x-bus.hx*19+bus.hz*11,bus.y+10,bus.z-bus.hz*19-bus.hx*11);engine.camera.lookAt(bus.x,bus.y+1.5,bus.z);engine.placeSun(new THREE.Vector3(bus.x,bus.y,bus.z));engine.render();requestAnimationFrame(tick);}
requestAnimationFrame(tick);
}catch(e){document.querySelector('#verdict').textContent='ERROR · '+e.message;console.error(e);}
</script></html>
