<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic, lamps and gantries review</title>
<style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden;font:14px/1.4 system-ui}#panel{position:fixed;z-index:3;left:12px;top:12px;max-width:min(550px,calc(100vw - 48px));padding:12px;border:1px solid #665078;border-radius:14px;background:#20172eeb;color:#f9f2e6}h1{font-size:18px;margin:0}p{margin:6px 0;font-size:12px}button{font:inherit;padding:7px 10px;margin:4px 4px 4px 0;border:1px solid #74617f;border-radius:8px;background:#3c2a4d;color:#fff}output{display:block;white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace}#status{color:#72f3d5;font-weight:700}</style>
<div id="view"></div><main id="panel"><h1>Traffic, lamps & gantries</h1><p>Production bus, route execution, pedestrian geometry and city lighting on bounded synthetic roads. FIXTURE 8A is a test service, not an agency route or normal-world gameplay verification.</p>
<button id="toggle">Start bus</button><button id="reset">Restart</button><button id="night">Night lighting</button><label><input id="watch-stop" type="checkbox">Pause during first exchange</label><br><button data-view="bus">Boarding side</button><button data-view="sign">Approach sign</button><button data-view="overview">Overview</button><output id="status">Loading…</output><output id="readout"></output></main>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {Engine} from '/src/core/engine.ts'; import {moodAt} from '/src/core/sky.ts'; import {initTemplates} from '/src/core/util.ts';
import {buildTile} from '/src/world/city.ts'; import {SignSystem} from '/src/world/signs.ts';
import {Traffic} from '/src/game/traffic.ts'; import {RoadGraph} from '/src/game/roadgraph.ts'; import {busRouteBoards} from '/src/world/traffic_models.ts';
if(!import.meta.env.DEV)throw new Error('Development component review only');
try{
initTemplates({rbox:new RoundedBoxGeometry(1,1,1,3,.12),ring:new THREE.RingGeometry(1,1.35,24)});
const road=(id,pts)=>({id,seg:id,pts,w:18,cls:'primary',lanes:4,name:id,oneway:'backward',elev:null,from:id+'-a',to:id+'-b',maxspeed:null});
const roads=[road('fixture-road',[[100,500],[900,500]]),road('opposite-road',[[900,540],[100,540]])];
const built=buildTile({i:0,j:0,roads,nodes:{},buildings:[],boards:[],furniture:[],areas:[],osm:[{id:'fixture-exit',k:'exit',p:[900,500],t:{ref:'1',destination:'FIXTURE EXIT'}}]},{lowQ:false});
const engine=new Engine(document.querySelector('#view'),{lowQ:false}),signs=new SignSystem(1,400);signs.init(0);engine.scene.add(signs.group);
for(const s of built.signs)signs.add({...s,c:new THREE.Vector3(...s.c),right:new THREE.Vector3(...s.right),up:new THREE.Vector3(...s.up)});
for(const buf of built.buffers){const geo=new THREE.BufferGeometry();for(const[name,data,size]of [['position',buf.pos,3],['normal',buf.nor,3],['uv',buf.uv,2],['color',buf.col,3]])geo.setAttribute(name,new THREE.BufferAttribute(data,size));const mesh=new THREE.Mesh(geo,engine.mats[buf.mat]);mesh.castShadow=true;mesh.receiveShadow=true;engine.scene.add(mesh);}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,650),new THREE.MeshStandardMaterial({color:'#9a978b',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(500,-.04,500);ground.receiveShadow=true;engine.scene.add(ground);
const city={surfaceGrid:built.surfaceGrid,buildingGrid:built.buildingGrid,landmarkSurfaceGrid:built.landmarkSurfaceGrid,walls:built.walls,obstacles:built.obstacles,movingRail:[]};
const graph=new RoadGraph(roads),traffic=new Traffic(graph,engine.scene,engine.mats,0,[],city);
const pattern={id:'fixture-8a',number:'FIXTURE 8A',direction:'0',from:'START',to:'TERMINAL',stops:['start','midway','terminal'],tripId:'fixture',publishedTrips:1,alignmentIds:['first','second']};
const alignment=(fromStop,toStop,from,to)=>({status:'inferred_legal_road_path',fromStop,toStop,steps:[{edge:'fixture-road',dir:1,from,to}],pts:[[100+from,500],[100+to,500]],lengthM:to-from,maxStopSnapM:0});
const feed={schema:2,origin:{lat:0,lon:0},attribution:'Synthetic component fixture',uncertainty:'Test-only roads; no claim of an agency service',stops:{start:['START',150,500],midway:['MIDWAY',210,500],terminal:['TERMINAL',650,500]},patterns:[pattern],alignments:{first:alignment('start','midway',50,110),second:alignment('midway','terminal',110,550)}};
let bus,running=false,night=false,view='bus',elapsed=0,last=performance.now(),dwellObserved=false;
const status=document.querySelector('#status'),readout=document.querySelector('#readout'),toggle=document.querySelector('#toggle');
function reset(){traffic.clear();traffic.setBusFeed(feed);const edge=graph.byId.get('fixture-road');bus=traffic.spawnAt('bus',edge,1,50);bus.busRun=traffic.services.bind(edge,1,50,0);if(!bus.busRun)throw new Error('Fixture route did not bind');bus.routeDecals=busRouteBoards(pattern.number,pattern.to);for(const d of bus.routeDecals)bus.g.add(new THREE.Mesh(d.geo,d.mat));running=false;elapsed=0;dwellObserved=false;toggle.textContent='Start bus';}
function mood(){engine.applyMood(moodAt(night?21:15),{signs:v=>signs.setEmissive(v)});}mood();reset();
toggle.onclick=()=>{running=!running;toggle.textContent=running?'Pause bus':'Resume bus';};document.querySelector('#reset').onclick=reset;
document.querySelector('#night').onclick=e=>{night=!night;e.target.textContent=night?'Daylight':'Night lighting';mood();};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view=b.dataset.view);
addEventListener('blur',()=>{running=false;toggle.textContent='Resume bus';});
function tick(now){const dt=Math.min(.035,Math.max(0,(now-last)/1000));last=now;
 if(running){elapsed+=dt;traffic.update(dt,bus.x,bus.z,{x:bus.x+290,z:bus.z+290,y:.55,speed:0,hx:1,hz:0},[]);dwellObserved ||= bus.dwell>0;if(document.querySelector('#watch-stop').checked&&bus.dwell>2&&bus.dwell<4){running=false;document.querySelector('#watch-stop').checked=false;toggle.textContent='Resume bus';}}
 let look=new THREE.Vector3(bus.x,bus.y+1.3,bus.z);
 if(view==='bus')engine.camera.position.set(bus.x+14,bus.y+6,bus.z-16);
 else if(view==='sign'){engine.camera.position.set(743,3.6,497);look.set(793,7,500);}
 else{engine.camera.position.set(440,98,580);look.set(500,0,520);}
 engine.camera.lookAt(look);engine.placeSun(look);signs.update(look.x,look.z);
 const nearest=built.lamps.slice().sort((a,b)=>Math.hypot(a[0]-look.x,a[2]-look.z)-Math.hypot(b[0]-look.x,b[2]-look.z));
 engine.lampLights.forEach((light,i)=>light.position.set(...(nearest[i]||[0,-200,0])));
 const exchange=bus.passengerExchange,people=traffic.passengerExchanges.reduce((sum,e)=>sum+e.people.filter(p=>p.group.visible).length,0);
 status.textContent=bus.dwell>0?'STOPPED · passenger exchange':bus.busRun.ended?'TERMINAL SERVED':running?'DRIVING ALLOTTED ROUTE':'PAUSED';
 readout.textContent=`Elapsed ${elapsed.toFixed(1)}s · speed ${(bus.speed*3.6).toFixed(1)} km/h\nDwell remaining ${bus.dwell.toFixed(2)}s · observed ${dwellObserved}\nExchange stop ${exchange?.group.userData.stopId||'—'} · visible passengers ${people}\nNext stop ${pattern.stops[bus.busRun.target]} · route ${bus.busRun.pattern.number}\nGenerated lamps ${built.lampFixtures.length} · panels ${built.signs.length}\nLight pools share each physical head; poles stay outside its carriageway.`;
 engine.render();requestAnimationFrame(tick);
}requestAnimationFrame(tick);
}catch(error){document.querySelector('#status').textContent='ERROR · '+error.message;console.error(error);}
</script></html>
