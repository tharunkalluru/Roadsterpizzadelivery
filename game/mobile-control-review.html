<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mobile control component QA</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
html,body{margin:0;min-height:100%;background:#4b665f;font:14px/1.35 system-ui,sans-serif}body:before{content:'';position:fixed;left:30%;right:30%;inset-block:0;background:#575962;border-inline:4px solid #eee2a2;pointer-events:none}
#qa-panel{box-sizing:border-box;position:fixed;z-index:6;top:max(10px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:650px;max-height:calc(100dvh - 210px);overflow:auto;padding:10px 12px;border-radius:12px;background:#fff6e4;color:#17132b}#qa-panel h1{margin:0 0 4px;font-size:18px}#qa-panel p{margin:4px 0}#qa-panel button,#qa-panel label{display:inline-flex;align-items:center;gap:5px;min-height:32px;margin:4px 8px 4px 0}#qa-panel button{padding:4px 10px}#qa-readout{display:block;white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace}
#hud .h-tl,#hud .h-tr,#hud .keys,#hud .speed,#hud .attr,#hud .guidance{visibility:hidden}
.qa-show-ui #hud .h-tl,.qa-show-ui #hud .h-tr,.qa-show-ui #hud .speed,.qa-show-ui #hud .guidance{visibility:visible}
body:has(#hud.has-offer) #qa-panel,body:has(#hud.has-tip) #qa-panel,.qa-clean #qa-panel{display:none}
</style>
<details id="qa-panel" open><summary>Mobile controls · component QA</summary><p>Production Hud controls on an inert background. These scenarios test the UI, not delivery gameplay or physical sensors.</p><label><input id="qa-gyro" type="checkbox">Simulate gyro steering</label><label><input id="qa-hud" type="checkbox">Show HUD</label><button id="qa-offer" type="button">New delivery preview</button><button id="qa-tip" type="button">Show blocking driving tip</button><button id="qa-area" type="button">Enter area preview</button><button id="qa-idle" type="button">Idle orders toggle preview</button><button id="qa-empty" type="button">Empty flight reserve</button><button id="qa-full" type="button">Full flight reserve</button><button id="qa-layout" type="button">Record layout rectangles</button><button id="qa-clean" type="button">Clean screenshot</button><button id="qa-landed" type="button">Complete landing preview</button><button id="qa-menu" type="button">Open test menu</button><button id="qa-reset" type="button">Release all controls</button><div><button data-action="collect" type="button">At pickup</button><button data-action="handover" type="button">At customer</button><button data-action="theatre" type="button">At theatre</button><button data-action="" type="button">Drive away</button></div><output id="qa-readout" aria-live="off"></output><pre id="qa-layout-results"></pre></details><div id="hud"></div>
<script type="module">
import{Hud,orderOfferHtml}from'/src/ui/hud.ts';
const hud=new Hud(true);let flights=0,actions=0,resets=0,context=null,progress=0,last=performance.now(),flying=false,descending=false,ordersUnlocked=false,accepting=true,activeOrder=false;
const ordersQa=document.createElement('button');ordersQa.id='qa-orders';ordersQa.type='button';ordersQa.textContent='After first delivery preview';document.querySelector('#qa-panel').insertBefore(ordersQa,document.querySelector('#qa-readout'));
ordersQa.addEventListener('click',()=>{ordersUnlocked=true;activeOrder=true;document.body.classList.add('qa-show-ui');document.querySelector('#qa-hud').checked=true;hud.orderAvailability({unlocked:true,accepting,activeOrder:true});hud.order({state:'Head to pickup',title:'A.M. Family',sub:'Charminar',dist:'373 m',time:'',meters:false,stage:'pickup',next:'Home in Panjeshah',orderId:'PZ-1043'});document.querySelector('#qa-panel').open=false;});
hud.onButton=id=>{if(id==='fly'){flights++;descending=flying;flying=!flying;hud.flightState(flying,descending);}if(id==='cruise')hud.setCruise(!hud.cruiseOn);if(id==='orders'){accepting=!accepting;hud.offer(null);hud.orderAvailability({unlocked:ordersUnlocked,accepting,activeOrder});}};
hud.onInputReset=()=>{resets++;};
hud.flightReserve(1,true);
document.querySelector('#qa-area').addEventListener('click',()=>hud.areaChip('HITEC City'));
document.querySelector('#qa-idle').addEventListener('click',()=>{clear();ordersUnlocked=true;accepting=false;activeOrder=false;document.body.classList.add('qa-show-ui');document.querySelector('#qa-hud').checked=true;hud.orderAvailability({unlocked:true,accepting:false,activeOrder:false});hud.order({state:'Free roam',title:'Explore Hyderabad',sub:'',dist:'',time:'',meters:false,stage:'idle'});});
document.querySelector('#qa-empty').addEventListener('click',()=>hud.flightReserve(0));
document.querySelector('#qa-full').addEventListener('click',()=>hud.flightReserve(1,true));
document.querySelector('#qa-clean').addEventListener('click',()=>document.body.classList.add('qa-clean'));
addEventListener('message',event=>{if(event.source===parent&&event.data==='qa-show-controls')document.body.classList.remove('qa-clean');});
document.querySelector('#qa-layout').addEventListener('click',()=>{const ids=['clock','level','b-theatre','b-full','b-report','b-help','coins','orders-toggle','order','area-chip','minimap','t-left','t-right','t-brake','t-gas','t-fly','t-cruise','t-act'];const rects={};for(const id of ids){const e=document.getElementById(id),r=e.getBoundingClientRect();if(r.width&&r.height&&!e.hidden&&(id!=='area-chip'||e.classList.contains('show')))rects[id]={x:r.x,y:r.y,width:r.width,height:r.height,position:getComputedStyle(e).position};}document.querySelector('#qa-layout-results').textContent=JSON.stringify({viewport:[innerWidth,innerHeight],rects,minimapFixed:getComputedStyle(document.getElementById('minimap')).position==='fixed',outsideViewport:Object.entries(rects).filter(([id,r])=>r.x<0||r.y<0||r.x+r.width>innerWidth+.5||r.y+r.height>innerHeight+.5).map(([id])=>id)},null,2);});

document.querySelector('#qa-gyro').addEventListener('change',event=>{hud.resetControls();hud.tiltOn=event.target.checked;hud.el.steering.hidden=hud.tiltOn;});
document.querySelector('#qa-hud').addEventListener('change',event=>document.body.classList.toggle('qa-show-ui',event.target.checked));
document.querySelector('#qa-landed').addEventListener('click',()=>{flying=false;descending=false;hud.flightState(false,false);});
const clear=()=>{context=null;progress=0;hud.resetControls();};
document.querySelector('#qa-reset').addEventListener('click',clear);
document.querySelector('#qa-tip').addEventListener('click',()=>{document.querySelector('#qa-panel').open=false;clear();hud.tipAcknowledgement('Hold GO to accelerate. Use the left and right arrows to steer. This driving tip pauses the action until you select Got it.');});
document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{clear();context=button.dataset.action||null;}));
document.querySelector('#qa-offer').addEventListener('click',()=>{document.querySelector('#qa-panel').open=false;clear();document.body.classList.add('qa-show-ui');document.querySelector('#qa-hud').checked=true;hud.offer(orderOfferHtml({level:1,orderId:'PZ-1042',pickupName:'A.M. Family',pickupRoad:'Charminar',customerName:'Home in Panjeshah',approachMetres:373,deliveryMetres:670,deliverySeconds:141,basePay:82}),[{label:'Accept order',cls:'go',fn:()=>{activeOrder=true;hud.offer(null);hud.order({state:'Head to pickup',title:'A.M. Family',sub:'Follow the orange route.',dist:'373 m',time:'',meters:false,stage:'pickup',next:'Home in Panjeshah',orderId:'PZ-1042'});hud.toast('Order accepted','teal');}},{label:'Decline',cls:'alt',fn:()=>hud.offer(null)}]);});
document.querySelector('#qa-menu').addEventListener('click',()=>{clear();hud.modal('<h2>Test menu</h2><p>Opening this production HUD dialog releases held controls.</p><button type="button" class="btn go" id="qa-close">Close menu</button>',sheet=>sheet.querySelector('#qa-close').addEventListener('click',()=>hud.modal(null)));});
const output=document.querySelector('#qa-readout');function read(now){const dt=Math.min((now-last)/1000,.05);last=now;if(context){progress=hud.touchAct?Math.min(1,progress+dt/.9):Math.max(0,progress-dt);if(progress>=1){actions++;context=null;progress=0;}}hud.prompt(context?'Component scenario action':null,progress,context);output.textContent=`Throttle: ${hud.touchGas?'HELD':'released'} · Brake: ${hud.touchBrake?'HELD':'released'} · Steer: ${hud.steer} · Cruise: ${hud.cruiseOn?'on':'off'}\nFLY presses: ${flights} · Completed UI holds: ${actions} · Action: ${context||'none'} · Progress: ${Math.round(progress*100)}%\nSteering: ${hud.tiltOn?'simulated gyro; arrows hidden':'arrow buttons'}`;requestAnimationFrame(read);}requestAnimationFrame(read);
</script></html>
